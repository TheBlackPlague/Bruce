[package]
name = "bruce"
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
description = "Neural Network Trainer Interface for StockDory"
repository = "https://github.com/TheBlackPlague/Bruce"

[features]
default = ["cuda"]
cuda = ["bullet_lib/cuda", "bullet-trainer/cuda", "bullet-gpu/cuda"]
rocm = ["bullet_lib/rocm", "bullet-trainer/rocm", "bullet-gpu/rocm"]
metal = ["bullet_lib/metal", "bullet-trainer/metal", "bullet-gpu/metal"]

[dependencies]
anyhow = "1"
bullet_lib = { git = "https://github.com/jw1912/bullet", rev = "1896c0884c7ededb1868068bbf5583d1726b37f6", default-features = false }
bullet-trainer = { git = "https://github.com/jw1912/bullet", rev = "1896c0884c7ededb1868068bbf5583d1726b37f6", default-features = false }
bullet-gpu = { git = "https://github.com/jw1912/bullet", rev = "1896c0884c7ededb1868068bbf5583d1726b37f6", default-features = false }
bullet-compiler = { git = "https://github.com/jw1912/bullet", rev = "1896c0884c7ededb1868068bbf5583d1726b37f6" }
clap = { version = "4.5", features = ["derive"] }
console = "0.16"
crc32c = "0.6"
ctrlc = "3.4"
indicatif = "0.18"
prost = "0.14"
rand = "0.9"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tempfile = "3"
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
bulletformat = { git = "https://github.com/jw1912/bulletformat", rev = "eddd9a2d77dbc1391d68f23ba524657e91bd9a73" }

# The upstream codec relies on wrapping negation for the minimum i16 score
[profile.dev.package.sfbinpack]
overflow-checks = false

[profile.test.package.sfbinpack]
overflow-checks = false
