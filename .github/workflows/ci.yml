name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --no-default-features --all-targets
      - name: Verify StockDory network compatibility
        if: runner.os == 'Linux'
        env:
          MANTARAY_ROOT: ${{ runner.temp }}/mantaray
        run: |
          git init "$MANTARAY_ROOT"
          git -C "$MANTARAY_ROOT" fetch --depth 1 https://github.com/TheBlackPlague/MantaRay.git 079959294e5c2b0c62e50f9222812d6f21014932
          git -C "$MANTARAY_ROOT" checkout --detach FETCH_HEAD
          cargo test --locked --no-default-features --test architecture -- --include-ignored

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --locked --no-default-features --all-targets --ignore-filename-regex '(^|/)tests/' --lcov --output-path coverage.lcov
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.lcov

  backend-check:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            backend: cuda
          - os: ubuntu-latest
            backend: rocm
          - os: macos-latest
            backend: metal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Type checks need SDK search paths but do not link or execute GPU code
      - run: cargo clippy --locked --no-default-features --features ${{ matrix.backend }} --all-targets -- -D warnings
        env:
          CUDA_PATH: /usr
          HIP_PATH: /usr
