name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: nightly-2026-10-01
          components: rustfmt
      - name: Check formatting
        shell: bash
        run: |
          if ! cargo +nightly-2026-10-01 fmt --all -- --check; then
            message='Formatting differs. Run: cargo +nightly-2026-10-01 fmt --all'
            echo "::error::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Check comments
        shell: bash
        run: |
          if grep -rnE '^\s*(//|/\*)' --include='*.rs' src | grep -v '// SAFETY:'; then
            echo "::error::Only // SAFETY: comments are allowed"
            exit 1
          fi

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: 1.99.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - run: cargo run --locked --no-default-features -- --help

  plot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.0"
      - run: uv sync --project plot --locked
      - run: uv run --project plot --locked ruff check --no-cache plot
      - run: uv run --project plot --locked ruff format --check --no-cache plot

  build:
    name: Build ${{ matrix.backend }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            backend: cuda
            platform: linux-x86_64
          - os: ubuntu-24.04
            backend: rocm
            platform: linux-x86_64
          - os: macos-26
            backend: metal
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: 1.99.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: ${{ matrix.backend }}
      - name: Install CUDA libraries
        if: matrix.backend == 'cuda'
        run: |
          curl -fsSLO https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cuda-cudart-dev-12-9 cuda-driver-dev-12-9 cuda-nvrtc-dev-12-9 libcublas-dev-12-9
          echo 'CUDA_PATH=/usr/local/cuda-12.9' >> "$GITHUB_ENV"
          echo 'RUSTFLAGS=-L native=/usr/local/cuda-12.9/lib64/stubs -C link-arg=-Wl,-rpath,/usr/local/cuda-12.9/lib64' >> "$GITHUB_ENV"
      - name: Install ROCm libraries
        if: matrix.backend == 'rocm'
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/6.4.3 noble main' | sudo tee /etc/apt/sources.list.d/rocm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends hip-dev hipblas-dev rocblas-dev
          echo 'HIP_PATH=/opt/rocm-6.4.3' >> "$GITHUB_ENV"
          echo 'RUSTFLAGS=-C link-arg=-Wl,-rpath,/opt/rocm-6.4.3/lib' >> "$GITHUB_ENV"
      - name: Lint
        run: cargo clippy --locked --no-default-features --features ${{ matrix.backend }} --all-targets -- -D warnings
      - name: Build executable
        run: cargo build --locked --release --no-default-features --features ${{ matrix.backend }} --bin bruce
      - name: Name executable
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          name="Bruce-${version}-${PLATFORM}-${BACKEND}"
          mkdir dist
          cp target/release/bruce "dist/$name"
          echo "BINARY_NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.BINARY_NAME }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [format, check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: Bruce-*
          path: release
          merge-multiple: true
      - name: Publish executables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi
